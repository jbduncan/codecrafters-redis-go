[settings]
experimental = true
lockfile = true

[tools]
go = "latest"

[tasks.build]
description = "Compile the server."
run = "go build -o /tmp/codecrafters-build-redis-go server.go"
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = { auto = true }
alias = "b"

[tasks.test]
description = "Run the tests."
run = "go test -shuffle=on -race -cover ./..."
depends = "build"
sources = ["go.mod", "go.sum", "**/*.go"]
outputs = { auto = true }
alias = "t"
